name: Update events and deploy

on:
  schedule:
    - cron: "0 5 * * *"   # every day 05:00 UTC (06:00/07:00 in Zurich)
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]       # redeploy whenever you edit the page or scraper

permissions:
  contents: write   # to commit events.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests

      - name: Scrape
        id: scrape
        continue-on-error: true   # still deploy the last good data if a venue breaks
        run: python scrape.py

      - name: Commit updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/events.json
          if ! git diff --staged --quiet; then
            git commit -m "Update events"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail the run if scraping failed (so GitHub emails you)
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Scraper failed - see the 'Scrape' step log."
          exit 1
